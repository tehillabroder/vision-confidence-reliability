dataset: MNIST
model: SimpleCNN
data_dir: data
checkpoint: checkpoints/mnist_simple_cnn.pt
output_dir: results/mnist_degradation_eval
validation_profile: results/mnist_validation_profile.json
seed: 42

training:
  epochs: 1
  batch_size: 64
  validation_size: 5000
  max_train_batches: null
  learning_rate: 0.001
  augmentation:
    resize: false
    random_crop: false
    rotation: false
    blur: false
    noise: false
    brightness_contrast: false

evaluation:
  batch_size: 64
  max_eval_batches: null
  degradations:
    - blur
    - noise
    - low_light
  severity_levels: [1, 2, 3, 4, 5]
  ece_bins: 10
  fixed_hcer_threshold: 0.90
  adaptive_hcer_percentile: 90

trust_policy:
  # a 1% floor prevents tiny baseline error rates from producing unstable ratios
  error_denominator_floor: 0.01
  
  caution:
    # five percentage points is a practical accuracy loss worth reviewing
    absolute_accuracy_drop: 0.05
    # 1.0 means the error rate has doubled from the undegraded baseline
    relative_error_increase: 1.0
    # these retain the first-pass calibration deterioration limits
    ece_increase: 0.03
    gap_deterioration: 0.05
    # HCER changes are judged against baseline rather than in isolation
    fixed_hcer_increase: 0.02
    adaptive_hcer_increase: 0.02

  do_not_trust:
    # larger limits reserve the strongest warning for substantial deterioration
    absolute_accuracy_drop: 0.15
    # 3.0 means the error rate has increased by 300%
    relative_error_increase: 3.0
    ece_increase: 0.08
    gap_deterioration: 0.12
    fixed_hcer_increase: 0.07
    adaptive_hcer_increase: 0.07